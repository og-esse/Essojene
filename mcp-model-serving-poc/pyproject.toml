[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-model-serving-poc"
version = "0.1.0"
description = "Python model-serving POC with FastAPI and MCP contracts"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110.0",
  "mcp>=1.0.0",
  "pydantic>=2.0.0",
  "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

