name: FX pricing engine

on:
  push:
    paths:
      - "automated-fx-pricing-engine/**"
      - ".github/workflows/fx-pricing.yml"
  pull_request:
    paths:
      - "automated-fx-pricing-engine/**"
      - ".github/workflows/fx-pricing.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automated-fx-pricing-engine

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automated-fx-pricing-engine/pyproject.toml
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Smoke-test model training
        run: train-fx-model --samples 5000 --output-dir /tmp/fx-model-smoke
